# Publier une version du serveur : poser une étiquette « v0.8.0 » sur
# main, ou lancer ce flux à la main depuis l'onglet Actions — il crée
# alors l'étiquette lui-même, d'après la version de package.json.
#
# Il publie :
#   - l'image ghcr.io/overline090/myhousehold (amd64 et arm64 : PC, NAS,
#     Raspberry Pi 64 bits) et celle de l'outil de mise à jour ;
#   - pour l'installation classique, une archive par architecture et sa
#     somme SHA-256, que l'outil de mise à jour vérifie avant d'installer ;
#   - le docker-compose.yml, l'installeur et les unités systemd.
name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/overline090/myhousehold
  IMAGE_MAJ: ghcr.io/overline090/myhousehold-maj

jobs:
  publier:
    name: Images, archives et publication
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: La version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à package.json ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mineure=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Vérifications
        run: |
          npm ci
          npx prisma generate
          npm run lint
          npm test
          bash -n deploy/installer.sh
          bash -n deploy/maj/myhousehold-maj

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image du serveur
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.mineure }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image de l'outil de mise à jour
        uses: docker/build-push-action@v6
        with:
          context: deploy/maj
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_MAJ }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_MAJ }}:latest

      # L'installation classique reçoit exactement ce que contient l'image :
      # modules natifs compris, construits pour chaque architecture.
      - name: Archives de l'installation classique
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p sortie
          for arch in amd64 arm64; do
            nom=x64; [ "$arch" = arm64 ] && nom=arm64
            id="$(docker create --platform "linux/$arch" "$IMAGE:$v")"
            mkdir -p "tmp-$arch"
            docker cp "$id:/app" "tmp-$arch/myhousehold-server-$v"
            docker rm "$id" >/dev/null
            tar -czf "sortie/myhousehold-server-$v-linux-$nom.tar.gz" -C "tmp-$arch" "myhousehold-server-$v"
            (cd sortie && sha256sum "myhousehold-server-$v-linux-$nom.tar.gz" > "myhousehold-server-$v-linux-$nom.tar.gz.sha256")
          done
          cp deploy/docker-compose.yml deploy/installer.sh deploy/maj/myhousehold-maj deploy/systemd/* sortie/
          # GitHub renomme les fichiers commençant par un point.
          cp .env.example sortie/env.example
          {
            echo "MyHousehold, serveur $v"
            echo
            echo "**Installer** (Docker, recommandé) :"
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${{ github.repository }}/releases/download/v$v/installer.sh"
            echo 'sudo bash installer.sh            # ou : sudo bash installer.sh --classique'
            echo '```'
            echo
            echo "Image : \`$IMAGE:$v\` (amd64, arm64). Une installation existante se met à jour seule, la nuit,"
            echo "si les mises à jour automatiques sont actives (Administration › Serveur)."
            echo
            echo "Sommes SHA-256 :"
            echo
            echo '```'
            cat sortie/*.sha256
            echo '```'
          } > notes.md

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: sortie/*
